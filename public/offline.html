<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Internet Connection | AttenSheet</title>
  <meta name="theme-color" content="#07110d">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #07110d;
      color: #F1F7F4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
      overflow-x: hidden;
      text-align: center;
    }

    /* Ambient background glow */
    body::before {
      content: "";
      position: fixed;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(ellipse, rgba(22, 166, 106, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 440px;
      width: 100%;
      background: rgba(13, 28, 22, 0.7);
      border: 1px solid rgba(120, 180, 150, 0.16);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #16A66A 0%, #0D7A4D 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(22, 166, 106, 0.3);
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #F1F7F4;
    }

    .brand-title span {
      color: #35D98A;
    }

    /* Radar / Offline Icon Animation */
    .icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 24px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(239, 98, 98, 0.4);
      animation: ripple 2s infinite ease-out;
    }

    .pulse-ring.delay {
      animation-delay: 0.8s;
    }

    .icon-bubble {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(239, 98, 98, 0.16) 0%, rgba(239, 98, 98, 0.06) 100%);
      border: 1px solid rgba(239, 98, 98, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #EF6262;
    }

    @keyframes ripple {
      0% {
        transform: scale(0.85);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #F1F7F4;
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 14px;
      line-height: 1.55;
      color: #A9BBB3;
      margin-bottom: 24px;
    }

    /* Live connection badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(239, 98, 98, 0.1);
      border: 1px solid rgba(239, 98, 98, 0.25);
      font-size: 12px;
      font-weight: 500;
      color: #EF6262;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #EF6262;
      box-shadow: 0 0 8px rgba(239, 98, 98, 0.8);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Action button */
    .retry-btn {
      width: 100%;
      background: linear-gradient(135deg, #16A66A 0%, #0D7A4D 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(22, 166, 106, 0.35);
    }

    .retry-btn:hover {
      background: linear-gradient(135deg, #1CC47C 0%, #16A66A 100%);
      transform: translateY(-1px);
    }

    .retry-btn:active {
      transform: scale(0.98);
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Help tips */
    .tips-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(120, 180, 150, 0.12);
      text-align: left;
    }

    .tips-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #71847C;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .tip-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #A9BBB3;
      margin-bottom: 6px;
    }

    .tip-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: #16A66A;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
      </div>
      <div class="brand-title">Atten<span>Sheet</span></div>
    </div>

    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <div class="pulse-ring delay"></div>
      <div class="icon-bubble">
        <!-- Disconnected Wifi SVG -->
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
    </div>

    <h1>No Internet Connection</h1>
    <p class="subtitle">
      AttenSheet requires an active network connection to securely authenticate, sync attendance, and load classes.
    </p>

    <div class="status-badge" id="status-badge">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Network Offline</span>
    </div>

    <button class="retry-btn" id="retry-btn" onclick="checkConnection()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-text">Try Reconnecting</span>
    </button>

    <div class="tips-box">
      <div class="tips-title">Troubleshooting</div>
      <div class="tip-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Check your Wi-Fi or cellular data connection</span>
      </div>
      <div class="tip-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Ensure Airplane mode is disabled</span>
      </div>
    </div>
  </div>

  <script>
    // Automatic reconnection detection
    window.addEventListener('online', function() {
      showOnlineState();
      setTimeout(function() {
        window.location.reload();
      }, 700);
    });

    function showOnlineState() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const badge = document.getElementById('status-badge');
      if (dot && text && badge) {
        dot.style.backgroundColor = '#35D98A';
        dot.style.boxShadow = '0 0 8px rgba(53, 217, 138, 0.8)';
        badge.style.borderColor = 'rgba(53, 217, 138, 0.4)';
        badge.style.backgroundColor = 'rgba(53, 217, 138, 0.12)';
        badge.style.color = '#35D98A';
        text.innerText = 'Connected! Reloading app...';
      }
    }

    function checkConnection() {
      const btn = document.getElementById('retry-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');

      spinner.style.display = 'inline-block';
      btnText.innerText = 'Checking...';
      btn.style.pointerEvents = 'none';

      // Test connectivity by pinging an icon or root
      fetch('/favicon.ico?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function() {
          showOnlineState();
          setTimeout(function() {
            window.location.reload();
          }, 500);
        })
        .catch(function() {
          setTimeout(function() {
            spinner.style.display = 'none';
            btnText.innerText = 'Try Reconnecting';
            btn.style.pointerEvents = 'auto';
            const text = document.getElementById('status-text');
            if (text) text.innerText = 'Still offline. Please check data';
          }, 1200);
        });
    }
  </script>
</body>
</html>
